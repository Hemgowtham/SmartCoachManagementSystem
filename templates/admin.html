<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailVision: Admin Central</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: white; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 20px; }
        .header h1 { color: #e94560; margin: 0; }
        
        /* DEMO PANEL */
        .demo-panel { background: #16213e; padding: 20px; border-radius: 12px; border: 2px solid #e94560; margin-bottom: 30px; text-align: center; }
        .demo-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #e94560; }
        
        .mode-switch { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
        .mode-btn { background: #0f3460; border: none; padding: 10px 20px; color: white; cursor: pointer; border-radius: 5px; opacity: 0.6; }
        .mode-btn.active { background: #e94560; opacity: 1; font-weight: bold; }

        video, #previewImg { width: 100%; max-width: 400px; height: 250px; border-radius: 8px; border: 2px solid #333; background: #000; object-fit: contain; }
        
        .control-row { display: flex; justify-content: center; gap: 10px; margin-top: 15px; flex-wrap: wrap;}
        select, input[type="file"] { padding: 10px; border-radius: 5px; border: none; font-weight: bold; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; }
        .btn-start { background: #2ecc71; }
        .btn-capture { background: #e94560; }
        
        /* GRID */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .coach-card { background: #16213e; border-radius: 10px; overflow: hidden; border: 1px solid #333; transition: 0.3s; }
        .cam-feed { width: 100%; height: 180px; object-fit: cover; background: #000; }
        .card-body { padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .status-badge { padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; color: black; }
        .safe { background: #2ecc71; } .mod { background: #f1c40f; } .danger { background: #e74c3c; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <h1>RailVision 🛡️ ADMIN</h1>
        <div>System: <span style="color:#2ecc71">ACTIVE</span></div>
    </div>

    <div class="demo-panel">
        <div class="demo-title">🛠️ Edge Simulation Tool</div>
        
        <div class="mode-switch">
            <button class="mode-btn active" onclick="setMode('cam')">📷 Live Camera</button>
            <button class="mode-btn" onclick="setMode('file')">📂 Upload Image</button>
        </div>

        <div id="camView">
            <video id="videoElement" autoplay playsinline></video>
        </div>

        <div id="fileView" style="display:none;">
            <img id="previewImg" src="https://placehold.co/400x250?text=Select+Image">
        </div>

        <div class="control-row">
            <button id="startBtn" class="btn btn-start" onclick="startCamera()">🔌 Start Cam</button>
            
            <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="previewFile()">

            <select id="targetCoach">
                <option value="GEN-1">Target: GEN-1</option>
                <option value="GEN-2">Target: GEN-2</option>
                <option value="GEN-3">Target: GEN-3</option>
                <option value="GEN-4">Target: GEN-4</option>
            </select>
            
            <button class="btn btn-capture" onclick="processData()">🚀 Analyze & Update</button>
        </div>
        <p id="statusMsg" style="color:#ccc; margin-top:10px;">Select mode to begin.</p>
    </div>

    <h3 style="color: #ccc;">Real-Time Coach Feeds</h3>
    <div class="grid-container" id="cameraGrid"></div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        let currentMode = 'cam';
        const video = document.getElementById('videoElement');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const statusMsg = document.getElementById('statusMsg');
        const canvas = document.getElementById('canvas');

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            if(mode === 'cam') {
                document.getElementById('camView').style.display = 'block';
                document.getElementById('fileView').style.display = 'none';
                document.getElementById('startBtn').style.display = 'block';
                fileInput.style.display = 'none';
            } else {
                document.getElementById('camView').style.display = 'none';
                document.getElementById('fileView').style.display = 'block';
                document.getElementById('startBtn').style.display = 'none';
                fileInput.style.display = 'block';
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                statusMsg.innerText = "Camera Active.";
            } catch (err) { console.error(err); statusMsg.innerText = "Camera Access Denied"; }
        }

        function previewFile() {
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { previewImg.src = e.target.result; }
                reader.readAsDataURL(file);
            }
        }

        async function processData() {
            let dataUrl = null;
            
            if (currentMode === 'cam') {
                if (!video.srcObject) return alert("Start Camera first!");
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                dataUrl = canvas.toDataURL('image/jpeg');
            } else {
                if (!fileInput.files[0]) return alert("Select an image first!");
                dataUrl = previewImg.src;
            }

            statusMsg.innerText = "Simulating Edge Processing...";
            const coachId = document.getElementById('targetCoach').value;

            try {
                const response = await fetch('/api/simulate_edge_processing', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: dataUrl, coach_id: coachId })
                });
                const result = await response.json();
                statusMsg.innerText = `✅ Success: ${result.count} people (${result.density}%) detected.`;
                fetchAdminData();
            } catch (err) { statusMsg.innerText = "Error sending data."; }
        }

        async function fetchAdminData() {
            const res = await fetch('/api/get_admin_data');
            const data = await res.json();
            const grid = document.getElementById('cameraGrid');
            
            if(grid.children.length === 0) {
                Object.entries(data.coaches).forEach(([id, info]) => {
                    grid.innerHTML += `
                        <div class="coach-card">
                            <img src="" class="cam-feed" id="img-${id}">
                            <div class="card-body">
                                <div>${id}</div><div class="status-badge safe" id="badge-${id}">--</div>
                            </div>
                        </div>`;
                });
            }
            
            Object.entries(data.coaches).forEach(([id, info]) => {
                const img = document.getElementById(`img-${id}`);
                const badge = document.getElementById(`badge-${id}`);
                if(info.image) img.src = `${info.image}?t=${new Date().getTime()}`;
                
                let cls = 'safe'; 
                if(info.crowd > 50) cls = 'mod'; 
                if(info.crowd > 85) cls = 'danger';
                badge.className = `status-badge ${cls}`;
                badge.innerText = `${info.crowd}%`;
            });
        }

        setInterval(fetchAdminData, 5000);
        fetchAdminData();
    </script>
</body>
</html>
